<!DOCTYPE html>
<!--
  eGABAY Marinduque map — source page.

  This is the dev-friendly shell: open it directly in a browser and everything
  works off the relative files in this directory.

  The app does NOT load this file. `npm run build:map` inlines the stylesheet
  and both scripts into the single-file bundle `../marinduque-map.html`, which
  is what MarinduqueMap.tsx embeds. Edit the files here, then rebuild.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>eGABAY · Marinduque Map</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css" />
<link rel="stylesheet" href="marinduque-map.css" />
</head>
<body>
<div id="map"></div>
<div id="map-error"></div>

<div class="panel" id="panel">
  <div class="panel-head">
    <div>
      <p class="panel-eyebrow">EGABAY MAP</p>
      <p class="panel-title">Marinduque</p>
      <p class="panel-sub">Coverage is limited to the island province.</p>
    </div>
    <button class="collapse-btn" id="collapse-btn" aria-label="Toggle panel">▾</button>
  </div>
  <div class="panel-body">
    <p class="panel-foot">Tip: double-click or double-tap the map to reset the view.</p>
    <p class="panel-foot">Boundary &amp; search via Nominatim · Routes via OSRM · Tiles © OpenStreetMap contributors</p>
  </div>
</div>

<div class="search-float">
  <div class="search-wrap">
    <input id="search" type="text" placeholder="Search places in Marinduque…" autocomplete="off" />
    <div id="results"></div>
  </div>
</div>

<div id="toast"></div>

<script src="vendor/maplibre-gl.js"></script>
<script src="marinduque-map.js"></script>
</body>
</html>
