<svg xmlns="http://www.w3.org/2000/svg" width="1298" height="1850" viewBox="0 0 1298 1850" role="img" aria-labelledby="title desc">
  <title id="title">eGABAY driver mobile UI wireframes</title>
  <desc id="desc">Six editable 390 by 844 mobile screen layouts for Home, trip consent, group updates, profile appearance, profile editing, and driver group application.</desc>
  <rect width="1298" height="1850" fill="#eef1ed"/>
